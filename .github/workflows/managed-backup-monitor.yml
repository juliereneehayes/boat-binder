name: Managed backup monitor

"on":
  schedule:
    - cron: "17 */12 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: managed-backup-monitor
  cancel-in-progress: false

jobs:
  check:
    if: github.repository == 'juliereneehayes/boat-binder' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production-monitoring

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0

      - name: Check managed backup health
        env:
          HEROKU_MANAGED_BACKUP_MONITOR_TOKEN: ${{ secrets.HEROKU_MANAGED_BACKUP_MONITOR_TOKEN }}
          HEROKU_MANAGED_BACKUP_MONITOR_APP: ${{ vars.HEROKU_MANAGED_BACKUP_MONITOR_APP }}
        run: ruby script/managed_backup_monitor
